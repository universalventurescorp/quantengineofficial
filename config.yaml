# The Quiet Ledger: pipeline configuration
channel:
  name: "The Quiet Ledger"
  language: en
  # said once, calmly, in the first minute (before the title card); never at the end
  subscribe_line: "If these quiet stories help you rest, you're welcome to subscribe now, before you close your eyes. That way, tomorrow night, we can keep walking together."

schedule:
  # days the long episode is produced (the workflow runs daily; on other days it does nothing
  # except the weekly analytics on Sundays). Use all seven days for a daily episode.
  # 31-oct-2026: Mon/Tue/Thu so the narrator's Kaggle GPU never overlaps Estrato Nocturno (Sun/Wed/Fri)
  episode_days: [Mon, Tue, Thu]

claude:
  model: sonnet           # sonnet | opus | haiku. Sonnet uses far less of the Pro plan's weekly limit
  on_limit: gemini        # when the plan's limit is hit: gemini (free fallback, needs GEMINI_API_KEY) | stop

script:
  chapters_per_call: 3    # chapters written per AI call (fewer calls = less quota used)

voice:
  # 31-oct-2026: British male narrator (Qwen3-TTS voice design "l2", chosen by Luis), cloned sentence by sentence
  # on Kaggle's free GPU (kaggle/voice.py). If Kaggle fails, the episode is narrated with Kokoro fallback_id.
  engine: qwen
  model: Qwen/Qwen3-TTS-12Hz-1.7B-Base
  ref_audio: assets/voices/ledger_narrator.mp3
  ref_text: "Tonight we will travel slowly, with no hurry at all, along the old roads where merchants carried silk and silver across the world."
  id: bm_george           # Kokoro voice used only as the fallback (British male, closest to the narrator)
  fallback_id: bm_george
  speed: 0.85
  wpm: 145                # sets script length. 31-oct sample: 125 gave chapters ~15 % longer than asked (13.8 min for 10)
  pause_sentence: 0.85
  pause_paragraph: 1.8
  pause_chapter: 3.5

video:
  target_minutes: 80      # narration length. Raise once a self-hosted runner is connected.
  width: 1920
  height: 1080
  fps: 24
  seconds_per_image: 11   # each still on screen ~11 s with a slow camera move
  clip_every: 4           # every Nth shot is a moving clip (data chart, archive film, studio footage)
  clips_per_chapter: 2
  charts_per_chapter: 1
  crf: 19
  preset: veryfast

mix:
  music_volume: 0.15
  lufs: -16

companion:
  # 31-oct-2026, from Estrato Nocturno: the narrator speaks to the one listener every ~11 min, softer (-4 dB)
  enabled: true
  every_minutes: 11
  first_minute: 6
  pause: 0.8              # extra silence before and after each moment (s)
  soft_db: -4

kaggle:
  kernel: quiet-ledger-voice   # this channel's own Kaggle script (never Estrato Nocturno's quiet-cosmos-gen)
  wait_minutes: 150

shorts:
  count: 3                # Shorts per episode, scheduled one per day after the episode
  voice_speed: 1.0
  gpu_voice_tempo: 1.08   # the GPU narrator, a little quicker in the Shorts (pitch kept)
  seconds_per_shot: 4.0
  publish_hour_utc: 16    # 11:00 in Lima, noon in New York

upload:
  privacy: public         # the Google Cloud project already passed the YouTube API audit
  publish_hour_utc: 23    # long episodes go public at 23:00 UTC (6 pm New York) if ready before then
  category_id: "27"       # Education
  made_for_kids: false
  synthetic_media: false

studio_footage:
  # Optional. A Google Drive folder ID with the studio's own clips (file names = tags, e.g.
  # "gold-coins-macro-slowmo.mp4"). Leave empty to run on archive imagery and charts only.
  drive_folder_id: ""

legacy:
  # Videos on the channel published before this date (the old QuantEngine Shorts) are set to
  # private automatically on the first run. Private is reversible in YouTube Studio.
  make_private_before: "2026-10-14"
