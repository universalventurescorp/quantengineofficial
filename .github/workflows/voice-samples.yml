name: voice-samples

on:
  workflow_dispatch:
    inputs:
      speeds:
        description: "Velocidades a comparar, separadas por espacio"
        default: "0.75 0.8 0.9"

permissions:
  contents: write

jobs:
  samples:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-v1
      - run: |
          set -o pipefail
          mkdir -p samples
          python -u scripts/voice_samples.py ${{ inputs.speeds }} 2>&1 | tee samples/log.txt
      - if: always()
        run: |
          git config user.name "quiet-ledger-bot"
          git config user.email "actions@users.noreply.github.com"
          git add samples/
          git commit -m "Voice speed samples" && git pull --rebase && git push
